[package]
name = "strata-log"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small, local, append-only JSONL event store for agents"
license = "MIT"
repository = "https://github.com/TMSCH/strata"
readme = "README.md"

[lib]
name = "strata"

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
